name: TheTowers
version: '${version}'

main: org.nanii.thetowers.TheTowers
api-version: '26.1.2'
load: POSTWORLD
depend: [ Multiverse-Core ]
libraries:
  - org.xerial:sqlite-jdbc:3.50.1.0
commands:
  arena:
    description: Comando de arena de TheTowers
    usage: /arena <list|join|spectate|leave>
  stats:
    description: Muesta las estadisticas de un jugador
    usage: /stats [jugador]
  top:
    description: Ranking de jugadores
    usage: /top <kills|point|wins|winrate>
permissions:
  thetowers.admin:
    description: Permite crear y romper carteles de The Towers
    default: op
